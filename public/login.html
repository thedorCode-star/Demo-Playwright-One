<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Demo App</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 80px auto; padding: 20px; }
    h1 { margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .message { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; }
    .message.error { background: #f8d7da; color: #721c24; }
    .message.success { background: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password">
    </div>
    <button type="submit" id="submitBtn">Sign In</button>
  </form>
  <div id="message" class="message" role="alert"></div>
  <p style="margin-top: 16px; text-align: center;">Don't have an account? <a href="/register">Register</a></p>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');

      messageEl.style.display = 'none';
      messageEl.className = 'message';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        messageEl.style.display = 'block';
        if (data.success) {
          messageEl.className = 'message success';
          messageEl.textContent = data.message;
          setTimeout(() => { window.location.href = data.redirectUrl || '/dashboard'; }, 500);
        } else {
          messageEl.className = 'message error';
          messageEl.textContent = data.message;
          submitBtn.disabled = false;
        }
      } catch (err) {
        messageEl.style.display = 'block';
        messageEl.className = 'message error';
        messageEl.textContent = 'Network error. Please try again.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
